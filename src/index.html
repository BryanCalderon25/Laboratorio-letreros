<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flyer Informativo UCR</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="flyer-container">
        <header class="header">
            <div class="logo-box">
                <span class="la-sede">LA SEDE</span>
                <span class="te-acompana">TE ACOMPAÑA</span>
            </div>
        </header>

        <main class="content">
            <h2 class="title-main">El respeto no se negocia</h2>
            <h1 class="title-sub">¡Pará ya de acosar!</h1>
            
        <div class="qr-section">
            <p>Si necesitas ayuda, escanea este QR:</p>
            <img src="Imagenes/qr.png" alt="QR" class="qr-img">
        </div>
        </main>

        <section class="people-section">
    <img src="Imagenes/personas.png" alt="Estudiantes UCR" class="person">
</section>

        <footer class="footer">
            <div class="footer-logos">
                <span class="footer-text">UCR</span>
                <span class="divider">|</span>
                <span class="footer-subtext">UCR LIBRE DE ACOSO SEXUAL</span>
                <span class="divider">|</span>
                <span class="footer-text">SG Sede de Guanacaste</span>
            </div>
        </footer>
    </div>



    <div class="sign-container">
    <div class="sign">
        <div class="sign-item">Aulas 5, 6, 7 <span>➜</span></div>
        <div class="sign-item">Apoyo Informático <span>➜</span></div>
        <div class="sign-item">Servidores <span>➜</span></div>
        <div class="sign-item">Laboratorio 1 y 2 <span>➜</span></div>
        <div class="sign-item">Coordinación Informática Empresarial <span>➜</span></div>
        <div class="sign-footer">UCR</div>
    </div>
</div>

</body>
</html>
